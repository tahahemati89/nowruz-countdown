<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./src/output.css">
</head>

<body class="text-white">

    <div class="main flex items-center justify-center">
        <div
            class=" flex items-center justify-center flex-col gap-4 bg-white/10 rounded-2xl p-10 border-[1px] border-white/25">
            <h2 class="text-3xl mb-4">Until the <span class="text-fuchsia-400">New Year</span></h2>

            <!-- باکس های اعداد  -->
            <div class="flex gap-6">
                <div class="flex flex-col items-center bg-sky-300/20 rounded-[10px] p-3">
                    <span class="days text-3xl"></span>
                    <span class="text-white/70">Days</span>
                </div>
                <div class="flex flex-col items-center bg-sky-300/20 rounded-[10px] p-3">
                    <span class="hours text-3xl"></span>
                    <span class="text-white/70">Hour</span>
                </div>
                <div class="flex flex-col items-center bg-sky-300/20 rounded-[10px] p-3">
                    <span class="minutes text-3xl"></span>
                    <span class="text-white/70">Min</span>
                </div>
                <div class="flex flex-col items-center bg-sky-300/20 rounded-[10px] p-3">
                    <span class="seconds text-3xl"></span>
                    <span class="text-white/70">Sec</span>
                </div>
            </div>
        </div>
    </div>

    <!-- scripts -->
    <script src=" ./scripts/main.js"></script>
</body>

</html>
